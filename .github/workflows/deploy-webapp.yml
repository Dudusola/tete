# Deploy the web app automatically.
#
# This was the last manual step in the whole system. Everything else already
# runs itself: the pipeline is on cron, the ledger commits itself, Telegram and
# the bot feed publish from the pipeline, and Render redeploys the API on every
# push. The frontend needed someone to remember two commands, in order, by hand
# — and forgetting the first one (the cache-bust) shipped stale JavaScript,
# which has caused real bugs before.
#
# ONE-TIME SETUP (the only thing a human has to do):
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#      Template "Edit Cloudflare Workers", or a custom token with
#      Account | Cloudflare Pages | Edit
#   2. gh secret set CLOUDFLARE_API_TOKEN --body "<token>"
#      gh secret set CLOUDFLARE_ACCOUNT_ID --body "<account id>"
#      (--body, never a pipe: PowerShell 5.1 prepends a BOM that breaks the
#      value server-side. Recorded in CLAUDE.md's gotchas.)
#
# Until those secrets exist this workflow skips cleanly rather than failing, so
# adding it changes nothing until it is ready to work.

name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'tools/tailwind/**'
      - 'tools/icon_subset.py'
      - 'tools/material_symbols_names.txt'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stylesheet is compiled HERE, every deploy, from the HTML/JS being
      # shipped. It replaced the Tailwind Play CDN (a 419 KB script that
      # compiled CSS in each visitor's browser). Building in the workflow means
      # production can never carry a stylesheet older than its own markup: a
      # class added without a local rebuild still gets its style.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/tailwind/package-lock.json
      - name: Build stylesheet
        working-directory: tools/tailwind
        run: |
          cp ../../webapp/css/app.css /tmp/committed.css
          npm ci --no-audit --no-fund
          npm run build
          test -s ../../webapp/css/app.css || { echo "::error::webapp/css/app.css is empty"; exit 1; }
          # Production is fine either way (it ships the fresh build); this only
          # says local dev and the Render fallback are running stale CSS.
          cmp -s /tmp/committed.css ../../webapp/css/app.css || \
            echo "::warning::committed webapp/css/app.css is stale - run 'npm run build' in tools/tailwind and commit it"
          wc -c ../../webapp/css/app.css

      # The icon font is subset to the icons the pages use (1.14 MB -> ~70 KB).
      # The list is derived from the source on every deploy, so a newly used
      # icon can never ship as its ligature text. See tools/icon_subset.py.
      - name: Subset the icon font to the icons in use
        run: |
          python3 tools/icon_subset.py --check || \
            echo "::warning::committed icon list is stale - run 'python tools/icon_subset.py' and commit"
          python3 tools/icon_subset.py
          grep -c "icon_names=" webapp/index.html

      # The cache-bust, computed rather than remembered.
      #
      # Shared JS is loaded as "js/<file>.js?v=N" and N was bumped by hand.
      # Forgetting it makes browsers serve the OLD script against NEW HTML,
      # which is how the "Couldn't book" bug happened. A content hash cannot be
      # forgotten and cannot be wrong: identical file, identical query string,
      # so caches still work; changed file, new string, so nobody sees stale JS.
      #
      # EVERY shared file must be stamped, the stylesheet included: a stale
      # app.css repaints the whole app against new markup, which is a louder
      # failure than a stale api.js, not a quieter one. The loop means a new
      # shared file only has to be added to SHARED below.
      - name: Stamp shared JS and CSS with a content hash
        run: |
          SHARED="js/api.js js/auth.js js/calc.js css/app.css"
          for f in $SHARED; do
            test -f "webapp/$f" || { echo "::error::webapp/$f is listed as shared but does not exist"; exit 1; }
            HASH=$(sha256sum "webapp/$f" | cut -c1-10)
            echo "$f hash: $HASH"
            sed -i -E "s|${f/./\\.}\?v=[A-Za-z0-9]+|$f?v=$HASH|g" webapp/*.html
          done
          # Fail loudly if any page still carries an unstamped reference: a
          # silent miss here is precisely the bug this step exists to stop.
          if grep -rnE '(js|css)/[a-z]*\.(js|css)"' webapp/*.html; then
            echo "::error::a shared file above is referenced without ?v= - add it to SHARED"
            exit 1
          fi
          grep -hoE '(js|css)/[a-z]*\.(js|css)\?v=[A-Za-z0-9]*' webapp/index.html

      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy. See the header of this workflow for the one-time setup."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webapp --project-name potentialpro
