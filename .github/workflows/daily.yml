# Daily pipeline in the cloud — so the ledger doesn't depend on one laptop
# being awake, on mains power, and online at noon (see CLAUDE.md bug #9).
#
# DO NOT enable the schedule until the probe workflow shows the scrapers work
# from here, AND the local Task Scheduler job is disabled. Two pipelines writing
# two copies of the ledger is how the track record becomes untrustworthy.
#
# The DB is committed back to the repo after each run: that makes THIS the
# authoritative ledger. It is a real architectural change, not a deployment
# detail — CONTRIBUTING.md says the DB lives on Boss's machine, and that stops
# being true the moment this workflow owns it.

name: Daily pipeline

on:
  workflow_dispatch:
  # LIVE since 6 Aug 2026. Moved to a 10:00 Africa/Lagos slot on 23 Aug 2026
  # (was '0 11 * * *' = 12:00 Lagos, itself chosen because 07:30 runs were
  # Cloudflare-blocked — that reason is now moot, see PP_SKIP_FOREBET below).
  #
  # Lagos is UTC+1 with no DST, so 10:00 local is 09:00 UTC. This is set to
  # 08:50 UTC on purpose: GitHub cron is best-effort and routinely lags 10+
  # minutes, and it lags WORST on the :00 mark because that is when everyone
  # else schedules. Nominal 09:50 Lagos + typical lag ≈ 10:00 Lagos, which is
  # the target. Every insert is INSERT OR IGNORE, so an early, late or repeated
  # run is harmless — arriving before the hour is strictly better than after.
  #
  # The local Task Scheduler job was disabled when this went live — if you
  # ever re-enable it, disable this, or two pipelines will write two diverging
  # copies of the ledger.
  schedule:
    - cron: '50 8 * * *'

# Never let two runs write the ledger at once.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # to commit the updated DB back

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium firefox

      # The 27 MB model is gitignored, but data/historical IS committed — so
      # rebuild it here and cache it. Key on the trainer + CSVs: refresh a CSV
      # or edit train.py and it retrains, otherwise it's restored in seconds.
      - name: Restore trained model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/*.joblib
          key: rf-model-${{ hashFiles('models/train.py', 'data/historical/**') }}

      - name: Train model (only on cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python models/train.py

      # Not cached, unlike the model above. The whole fit is ~10s over 98k
      # matches, and caching it would reintroduce exactly the staleness the
      # cache key protects the RF from: goals_model.load() treats a missing or
      # old file as "fall back to a flat league total" and logs nothing, so a
      # newly added league would price its goals markets off a league average
      # forever while looking completely healthy. Refitting unconditionally
      # costs less than the cache lookup would.
      - name: Fit team goal ratings
        run: python -m models.goals_model

      - name: Ensure DB schema exists
        run: python db/database.py

      - name: Run pipeline
        env:
          # Add these under Settings -> Secrets and variables -> Actions.
          # Missing ones degrade gracefully: no Gemini key falls back to Ollama
          # (absent here, so analysis is skipped), no Telegram = no alerts.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cloud fallback for the analysis text. Optional: absent it simply
          # never fires. Add the secret and Gemini outages stop mattering.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          DB_PATH: ./db/sports_predictor.db
          # Forebet is Cloudflare-403'd from GitHub's IPs — verified, not
          # assumed. Skipping keeps a known-unfixable block from looking like
          # a daily failure. It still runs locally, where it works.
          PP_SKIP_FOREBET: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python run_daily.py

      # Sending is one HTTPS call — it never needed the long-running bot.
      # telegram_bot.py still serves the interactive commands; this only
      # replaces the 08:00 push that used to depend on that process being up
      # on a laptop that was often off.
      # if: always() — a DEGRADED run still has picks worth sending. Without
      # this these steps inherit the default "only if everything succeeded",
      # so when API-Football's suspension turned the pipeline red the daily
      # Telegram push and the bot feed were SKIPPED: a tolerable data-source
      # outage silently became a total user-facing one.
      - name: Send picks to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python bot/send_daily.py

      # Feed for the always-on webhook worker (worker/index.js). Everything it
      # serves is computed here, so /picks and /stats can never disagree with
      # the ledger.
      - name: Publish bot feed
        if: always()
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python bot/export_feed.py

      # --strict exits non-zero when the ledger has stopped moving, so this job
      # goes RED and GitHub notifies. Without it the script always exited 0 and
      # a stalled pipeline printed warnings into a green build — precisely how
      # the 12-day stall (bug #9) stayed invisible.
      - name: Ledger health
        if: always()
        run: python db/track_record_health.py --strict

      - name: Commit the updated ledger
        if: always()
        run: |
          git config user.name  "potentialpro-bot"
          git config user.email "actions@github.com"
          # db/*.db is gitignored on purpose (it's per-developer locally);
          # -f is deliberate — in the cloud this file IS the ledger.
          # data/historical/*.csv are TRACKED and the "Refresh training CSVs"
          # step rewrites them, so they sit in the worktree as unstaged
          # changes. git pull --rebase refuses to run with those present —
          # "cannot pull with rebase: You have unstaged changes" — which is
          # exactly how 10 Aug's fixtures and predictions were computed,
          # committed locally, and then never pushed. Stage them too: a
          # refreshed CSV is part of the state this job produces.
          git add -f db/sports_predictor.db feed/bot_feed.json
          git add -A data/historical || true
          # Non-soccer training history (scrapers/sports_history.py). Kept
          # OUT of data/historical so it neither trains the football model
          # nor changes the model cache key.
          git add -A data/sports_history || true
          # Refitted above from whatever historical CSVs are now present. It has
          # to be committed, not just built: deploy/render/Dockerfile COPYs it
          # into the API image, so the ratings Render prices with are the ones
          # in the repo, not the ones this runner just computed.
          git add data/goals_ratings.json || true
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "ledger: automated run $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Rebase in case a human pushed while we ran; the DB is binary, so
            # a conflict here means someone else wrote the ledger too — fail
            # loudly rather than silently picking a side.
            # --autostash so any remaining stray worktree change (a log, a
            # scratch file) cannot block the pull the way it did on 10 Aug.
            git pull --rebase --autostash --no-edit || {
              echo "::error::git pull --rebase failed - read the git output above for the reason. If it names db/sports_predictor.db, two runs wrote the ledger; otherwise it is a worktree or network problem (bug #14: an unstaged file once caused this and was misreported as a second writer)."
              exit 1
            }
            git push
          fi
