# Closing prices — the market's price for each pick just before kickoff.
#
# WHY: closing-line value (does the price move toward our picks after we make
# them?) is the fastest honest test of an edge, and it needs no match result.
# ESPN removes odds from finished games, so the close can only be captured
# BEFORE kickoff: every hour this does not run is closes lost for good. See
# scrapers/closing_snapshot.py and db/clv_report.py.
#
# Deliberately tiny: no scraping of fixtures, no predictions, no Playwright.
# It only writes close_* columns on predictions that already exist, so it can
# never change a pick.

name: Closing prices

on:
  workflow_dispatch:
  schedule:
    # Every hour at :20. The script looks 75 minutes ahead, so GitHub's cron
    # lag (often 10+ min) cannot leave a kickoff between two runs.
    - cron: '20 * * * *'

# Same group as every other ledger writer: one writer at a time.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Check out the branch AS IT IS NOW, not the commit this run was queued
      # on. checkout@v4 defaults to github.sha, the commit at TRIGGER time; a
      # run that waited in the daily-pipeline queue therefore started from a
      # ledger older than the one the previous run just pushed, and its own
      # push was refused (28 Sep 2026: the results sweep queued behind a manual
      # pipeline run failed exactly this way). The queue stops two runs writing
      # at once; this makes each run start from the latest ledger.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install requests loguru python-dotenv

      - name: Apply DB migrations
        # The close_* columns may not exist yet if this runs before the next
        # daily pipeline has migrated the ledger.
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
        run: python db/database.py

      - name: Snapshot closing prices
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
        run: python scrapers/closing_snapshot.py

      - name: Non-soccer lines, live state and finals (NFL/NBA/NHL/MLB)
        # Stores each moneyline CHANGE in market_lines, so every game keeps
        # its opening and closing price (ESPN deletes odds once a game is
        # final). Also refreshes live_state and records finals. A narrow
        # window keeps it to ~16 requests.
        continue-on-error: true
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
        run: python scrapers/espn_ledger.py --days-back 1 --days-ahead 2

      - name: Refresh shadow Elo predictions (never served)
        # Updates each upcoming game's Elo probability and the market price
        # beside it, so both are graded as close to kickoff as possible.
        continue-on-error: true
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
        run: python models/elo_shadow.py

      - name: Record SportyBet's prices (appended on change)
        # Hourly, so the value test (db/sporty_value_report.py) grades the LAST
        # SportyBet price before kickoff, not the 06:00 one. Read through our
        # API on Render: SportyBet blocks GitHub's runner IPs.
        continue-on-error: true
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
          SPORTY_EVENTS_VIA: https://potentialpro-api.onrender.com
        run: python scrapers/sporty_lines.py

      - name: Write analysis for NHL/NFL picks that have none (or stale)
        # Hourly so a pick gets its write-up soon after it is first priced,
        # not at the next 06:00 run. Only MISSING or 18h+ old text is written,
        # and only for served (HIGH/MEDIUM) picks, so most hours make zero or a
        # handful of provider calls. Prose is explanation, never the pick.
        continue-on-error: true
        env:
          DB_PATH: ./db/sports_predictor.db
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python analysis/nhl_analyst.py

      - name: Commit the updated ledger
        if: always()
        run: |
          git config user.name  "potentialpro-bot"
          git config user.email "actions@github.com"
          git add -f db/sports_predictor.db
          if git diff --cached --quiet; then
            echo "No picks near kickoff this hour."
          else
            git commit -m "ledger: closing prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            # --autostash: bug #14 was a stray worktree change making the rebase
            # refuse. And the message names what failed, not a guessed cause.
            git pull --rebase --autostash --no-edit || {
              echo "::error::git pull --rebase failed; see the log above for the actual reason."
              exit 1
            }
            git push
          fi
