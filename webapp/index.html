<body>

<main class="max-w-container-max mx-auto px-gutter md:px-lg py-md md:py-xl">

<!-- Summary stat strip -->

<!-- Tier filter chips + status -->
<div class="flex flex-wrap items-center justify-between gap-sm mb-md">

    <button data-tier="ALL"    class="tier-chip px-md py-base rounded-full text-label-sm font-bold border border-outline-variant transition">All</button>

<!-- Prediction feed (cards injected here) -->

</main>

<!-- Mobile Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant flex justify-around items-center px-4 py-2 shadow-lg">

<span class="text-label-sm">Picks</span></a>

<span class="material-symbols-outlined mb-1">receipt_long</span><span class="text-label-sm">Builder</span></a>

<span class="material-symbols-outlined mb-1">query_stats</span><span class="text-label-sm">Record</span></a>

<span class="material-symbols-outlined mb-1">fact_check</span><span class="text-label-sm">Checker</span></a>

<script src="js/api.js?v=12"></script>
<script>
// HIGH -> green badge, MEDIUM -> blue badge
function badgeClasses(conf) {
    return conf === "HIGH"
        ? "bg-secondary-container text-on-secondary-container"
        : "bg-tertiary-fixed-dim text-tertiary-container";
}

function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => (
        {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
}

// Cross-source agreement badge: shown only when 2+ sources cover the fixture
function consensusBadge(c) {
    if (!c) return "";
    if (c.agree) {
        return `<span class="inline-flex items-center gap-xs bg-secondary-container text-on-secondary-container px-sm py-base rounded-full text-label-sm font-bold" title="Forebet and PredictZ agree on this outcome">
          <span class="material-symbols-outlined text-[14px]">handshake</span>${c.sources} sources agree</span>`;
    }
    return `<span class="inline-flex items-center gap-xs bg-surface-container-high text-on-surface-variant px-sm py-base rounded-full text-label-sm font-bold" title="Sources disagree on the outcome — extra caution">
      <span class="material-symbols-outlined text-[14px]">alt_route</span>sources split</span>`;
}

function renderCard(p) {
    const conf = p.confidence || "MEDIUM";
    const prob = Math.round((p.best_bet_prob || 0) * 100);
    const homePct = Math.round((p.home_win_prob || 0) * 100);
    const drawPct = Math.round((p.draw_prob || 0) * 100);
    const awayPct = Math.round((p.away_win_prob || 0) * 100);
    const analysis = p.gemma_analysis ? escapeHtml(p.gemma_analysis) : "No analysis available for this pick.";
    const started = hasKickedOff(p.match_date, p.kickoff_time);
    const meta = `${escapeHtml(prettyLeague(p.league))} • ${escapeHtml(kickoffLabel(p.match_date, p.kickoff_time))}`
        + (started ? ` <span class="inline-flex items-center gap-xs bg-surface-container-high text-on-surface-variant px-sm rounded-full normal-case" title="Kickoff has passed — too late to bet this one">started</span>` : "");

    return `
<article class="glass-card rounded-xl p-md shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group${started ? " opacity-60" : ""}">
  <div class="absolute left-0 top-0 bottom-0 w-[2px] bg-secondary-container opacity-0 group-hover:opacity-100 transition-opacity"></div>
  <div class="flex justify-between items-start mb-sm">
    <div>
      <span class="text-label-sm text-on-tertiary-container uppercase tracking-wider">${meta}</span>
      <h2 class="text-headline-md font-headline-md text-primary mt-base">${escapeHtml(p.home_team)} vs ${escapeHtml(p.away_team)}</h2>
    </div>
    <div class="flex flex-col items-end gap-xs">
      <div class="${badgeClasses(conf)} px-sm py-base rounded-full text-label-sm font-bold flex items-center gap-xs">${conf}</div>
      ${consensusBadge(p.consensus)}
      ${p.consensus_adj === "boosted" ? `<span class="inline-flex items-center gap-xs bg-secondary-container text-on-secondary-container px-sm py-base rounded-full text-label-sm font-bold" title="Raised to HIGH because both sources back the model's pick"><span class="material-symbols-outlined text-[14px]">arrow_upward</span>consensus boost</span>` : ""}
      ${p.consensus_adj === "demoted" ? `<span class="inline-flex items-center gap-xs bg-error-container text-on-error-container px-sm py-base rounded-full text-label-sm font-bold" title="Lowered to MEDIUM because both sources back a different outcome"><span class="material-symbols-outlined text-[14px]">arrow_downward</span>tier lowered</span>` : ""}
    </div>
  </div>
  <div class="bg-surface p-sm rounded-lg border border-outline-variant mb-md flex justify-between items-center">
    <div>
      <div class="text-label-sm text-on-surface-variant mb-base">Recommendation</div>
      <div class="text-body-lg font-semibold text-primary">${escapeHtml(p.best_bet)}</div>
      ${p.predicted_home_goals != null ? `<div class="text-label-sm text-on-surface-variant mt-base flex items-center gap-xs">
        <span class="material-symbols-outlined text-[14px]">scoreboard</span>
        Expected: ${Math.round(p.predicted_home_goals)} – ${Math.round(p.predicted_away_goals)}</div>` : ""}
    </div>
    <div class="text-right flex flex-col items-end">
      <div class="text-label-sm text-on-surface-variant mb-base">Probability</div>
      <div class="relative w-12 h-12 flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
          <path class="text-surface-container-high stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-width="3"></path>
          <path class="text-secondary stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="${prob}, 100" stroke-width="3"></path>
        </svg>
        <span class="absolute text-label-sm font-bold text-primary">${prob}%</span>
      </div>
    </div>
  </div>
  <div class="flex gap-xs mb-md text-label-sm text-on-surface-variant">
    <span class="flex-1 text-center bg-surface rounded p-1 border border-outline-variant">H ${homePct}%</span>
    <span class="flex-1 text-center bg-surface rounded p-1 border border-outline-variant">D ${drawPct}%</span>
    <span class="flex-1 text-center bg-surface rounded p-1 border border-outline-variant">A ${awayPct}%</span>
  </div>
  <div class="border-t border-outline-variant pt-sm">
    <button class="flex items-center justify-between w-full text-left text-body-md text-on-surface-variant hover:text-secondary focus:outline-none" onclick="this.nextElementSibling.classList.toggle('hidden')">
      <span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">smart_toy</span> AI Analysis</span>
      <span class="material-symbols-outlined text-[18px]">expand_more</span>
    </button>
    <div class="hidden mt-sm text-body-md text-on-surface-variant leading-relaxed">${analysis}</div>
  </div>
</article>`;
}

// ── Summary stat strip ───────────────────────────────────────────────
function statTile(label, value, sub, icon, accent) {
    return `
    <div class="glass-card rounded-xl p-md flex flex-col justify-between">
      <div class="flex items-center justify-between">
        <span class="text-label-sm text-on-surface-variant uppercase tracking-wider">${label}</span>
        <span class="material-symbols-outlined text-[18px] ${accent || "text-on-surface-variant"}">${icon}</span>
      </div>
      <div class="text-headline-md font-headline-md font-bold text-primary mt-base">${value}</div>
      <div class="text-label-sm text-on-surface-variant">${sub}</div>
    </div>`;
}

function renderStatStrip(picks, stats) {
    const high = picks.filter(p => p.confidence === "HIGH").length;
    const agree = picks.filter(p => p.consensus && p.consensus.agree).length;
    const acc = stats && stats.accuracy != null ? `${stats.accuracy}%` : "—";
    const accSub = stats && stats.scored_picks
        ? `${stats.correct}/${stats.scored_picks} scored` : "building";
    document.getElementById("stat-strip").innerHTML =
        statTile("Today", picks.length, "model picks", "today", "text-secondary") +
        statTile("High conf.", high, "≥65% probability", "verified", "text-secondary") +
        statTile("Sources agree", agree, "2+ sources aligned", "handshake", "text-secondary") +
        statTile("Hit rate", acc, accSub, "target", "text-secondary");
}

// ── Skeleton loading cards ───────────────────────────────────────────
function skeletonCard() {
    return `<article class="glass-card rounded-xl p-md animate-pulse">
      <div class="h-3 w-1/3 bg-surface-container-high rounded mb-sm"></div>
      <div class="h-5 w-2/3 bg-surface-container-high rounded mb-md"></div>
      <div class="h-16 bg-surface-container-high rounded mb-md"></div>
      <div class="flex gap-xs"><div class="h-6 flex-1 bg-surface-container-high rounded"></div>
        <div class="h-6 flex-1 bg-surface-container-high rounded"></div>
        <div class="h-6 flex-1 bg-surface-container-high rounded"></div></div>
    </article>`;
}

let ALL_PICKS = [];
let CURRENT_TIER = "ALL";
let UPDATED_AT = null;

function paintTierChips() {
    document.querySelectorAll(".tier-chip").forEach(c => {
        const on = c.dataset.tier === CURRENT_TIER;
        c.classList.toggle("bg-secondary-container", on);
        c.classList.toggle("text-on-secondary-container", on);
        c.classList.toggle("border-secondary-container", on);
        c.classList.toggle("text-on-surface-variant", !on);
    });
}

function renderFeed() {
    const feed = document.getElementById("picks-feed");
    const status = document.getElementById("status");
    const shown = CURRENT_TIER === "ALL"
        ? ALL_PICKS : ALL_PICKS.filter(p => p.confidence === CURRENT_TIER);
    if (shown.length === 0) {
        feed.innerHTML = `<div class="col-span-full text-center text-on-surface-variant py-xl">
          No ${CURRENT_TIER === "ALL" ? "" : CURRENT_TIER.toLowerCase() + " "}picks in this view.</div>`;
    } else {
        feed.innerHTML = shown.map(renderCard).join("");
    }
    const ago = timeAgo(UPDATED_AT);
    status.textContent = `${shown.length} of ${ALL_PICKS.length} shown${ago ? ` • updated ${ago}` : ""}`;
}

async function loadPicks() {
    const feed = document.getElementById("picks-feed");
    const status = document.getElementById("status");
    feed.innerHTML = Array(4).fill(skeletonCard()).join("");
    status.textContent = "Loading…";
    try {
        const [data, stats] = await Promise.all([
            PotentialProAPI.picks(),
            PotentialProAPI.stats().catch(() => null),
        ]);
        ALL_PICKS = (data.picks || []).slice().sort((a, b) =>
            (kickoffDate(a.match_date, a.kickoff_time) || 0) - (kickoffDate(b.match_date, b.kickoff_time) || 0));
        UPDATED_AT = data.generated_at || null;
        renderStatStrip(ALL_PICKS, stats);
        if (ALL_PICKS.length === 0) {
            feed.innerHTML = `<div class="col-span-full text-center text-on-surface-variant py-xl">
              No HIGH or MEDIUM picks right now. The model is sitting today's fixtures out — no bet is also a decision.</div>`;
            status.textContent = "";
            return;
        }
        renderFeed();
    } catch (err) {
        feed.innerHTML = "";
        status.textContent = "";
        document.getElementById("stat-strip").innerHTML =
          `<div class="col-span-full glass-card rounded-xl p-md text-center text-error">
             ⚠️ Couldn't reach the prediction engine. Start it with: uvicorn api.server:app --port 8080</div>`;
        console.error(err);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".tier-chip").forEach(c =>
        c.addEventListener("click", () => {
            CURRENT_TIER = c.dataset.tier; paintTierChips(); renderFeed();
        }));
    paintTierChips();
    loadPicks();
});
</script>
