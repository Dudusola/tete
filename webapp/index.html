<!-- Matches (23 Oct 2026). The live tracker, split out of Picks: every match we
     cover, by day and league, with live and full-time scores. Picks stays about
     what to bet; this page is about what is on. Data: GET /api/matches.
     Hallmark: in-system page, utilitarian, existing tokens - no new theme. -->
<main class="max-w-3xl mx-auto px-gutter md:px-lg pt-md md:pt-xl">
<header class="mb-md">
  <h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-primary">Matches</h1>
  <p class="text-body-md text-on-surface-variant mt-xs">Every match we cover, with live scores and results. Tap a match for the details.</p>
</header>

<div id="sport-strip" role="group" aria-label="Sport" class="flex gap-xs overflow-x-auto [scrollbar-width:none] -mx-gutter px-gutter md:mx-0 md:px-0 pb-1 mb-xs"></div>

<input id="search" type="search" placeholder="Search team or league" aria-label="Search team or league"
       class="w-full rounded-lg border border-outline-variant px-md py-sm text-body-md bg-surface mb-xs"/>
<div class="sticky top-0 md:top-16 z-30 bg-surface -mx-gutter px-gutter md:mx-0 md:px-0 py-xs mb-sm border-b border-outline-variant">
  <div id="day-strip" role="group" aria-label="Day" class="flex gap-xs overflow-x-auto [scrollbar-width:none] pb-1"></div>
  <div id="status-strip" role="group" aria-label="Show" class="flex gap-xs overflow-x-auto [scrollbar-width:none] pt-xs"></div>
</div>
<div id="list" aria-live="polite"></div>
</main>

<script>
let MATCHES = [];
let DAY = "";
let STATUS = "all";        // all | live | finished | upcoming
// Football, NHL, NBA and NFL (23 Oct 2026). "all" by default; remembered per device.
const SPORT_CHIPS = [["all", "All sports", "apps"], ["football", "Football", "sports_soccer"],
    ["nhl", "NHL", "sports_hockey"], ["nba", "NBA", "sports_basketball"], ["nfl", "NFL", "sports_football"]];
let SPORT = (() => { try { return localStorage.getItem("pp-matches-sport") || "all"; } catch (_) { return "all"; } })();
const inSport = m => SPORT === "all" || m.sport === SPORT;
function renderSports() {
    const box = document.getElementById("sport-strip");
    box.innerHTML = SPORT_CHIPS.filter(([k]) => k === "all" || MATCHES.some(m => m.sport === k)).map(([k, label, icon]) =>
        `<button type="button" data-sport="${k}" aria-pressed="${k === SPORT}"
           class="shrink-0 inline-flex items-center gap-xs min-h-[36px] px-md py-xs rounded-full border text-label-sm font-bold ${k === SPORT
             ? "bg-primary text-on-primary border-primary"
             : "border-outline-variant text-on-surface-variant hover:bg-surface-container-high"}">
           <span class="material-symbols-outlined text-[16px]" aria-hidden="true">${icon}</span>${label}</button>`).join("");
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        SPORT = b.dataset.sport;
        try { localStorage.setItem("pp-matches-sport", SPORT); } catch (_) {}
        pickDay();
        renderSports(); renderDays(); renderStatus(); renderList();
    }));
}
const FAVS = new Set((() => { try { return JSON.parse(localStorage.getItem("pp-fav-leagues") || "[]"); } catch (_) { return []; } })());
// Stars live on this device and, when signed in, on the account too: the
// morning alert's "Your leagues" line reads them (worker/push.js).
function saveFavs() {
    try { localStorage.setItem("pp-fav-leagues", JSON.stringify([...FAVS])); } catch (_) {}
    if (window.PPAuth && PPAuth.user()) PPAuth.prefs.save({ leagues: [...FAVS].slice(0, 50) })
        .catch(err => { console.error("favourites:", err); showToast("Starred here, but couldn't save it to your account."); });
}
// Signed in on a new device: bring the account's stars here (union, never a loss).
async function syncFavs() {
    if (!window.PPAuth) return;
    await PPAuth.ready();
    if (!PPAuth.user()) return;
    try {
        const p = await PPAuth.prefs.get();
        const before = FAVS.size;
        (p.leagues || []).forEach(l => FAVS.add(l));
        if (FAVS.size !== before) { try { localStorage.setItem("pp-fav-leagues", JSON.stringify([...FAVS])); } catch (_) {} if (MATCHES.length) renderList(); }
        if (FAVS.size !== (p.leagues || []).length) saveFavs();
    } catch (err) { console.error("favourites:", err); }
}

// The kickoff's day in the viewer's own timezone, so the strip agrees with the times shown.
function dayOf(m) {
    const d = kickoffDate(m.match_date, m.kickoff_time, m.kickoff_utc);
    if (!d) return m.match_date;
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayName(key) {
    const d = new Date(`${key}T12:00`), t = new Date(); t.setHours(12, 0, 0, 0);
    const diff = Math.round((d - t) / 864e5);
    return diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday"
         : d.toLocaleDateString([], {weekday: "short", day: "numeric"});
}
const isFinal = m => m.result_home_goals != null || (m.live_score && m.live_final);
const inPlay = m => m.result_home_goals == null && m.live_score && !m.live_final;
function score(m) {
    if (m.result_home_goals != null) return [m.result_home_goals, m.result_away_goals];
    if (m.live_score) return m.live_score.split("-");
    return null;
}
// Only a recorded result grades a pick (the record's rule); a feed score does not.
function verdict(m) {
    if (m.result_outcome == null) return "";
    // NHL/NBA/NFL picks are the full-game moneyline: a level NFL final is a push (void), as in the record.
    if (m.sport !== "football" && m.result_outcome === "D") return ` · <span class="text-on-surface-variant">void</span>`;
    const won = {"Home Win": "H", "Draw": "D", "Away Win": "A"}[m.best_bet] === m.result_outcome;
    return ` · <span class="${won ? "text-secondary" : "text-error"}">${won ? "won" : "lost"}</span>`;
}
function pickName(m) {
    return ppPlainPick(m.best_bet === "Home Win" ? `${m.home_team} Win` : m.best_bet === "Away Win" ? `${m.away_team} Win` : m.best_bet);
}

const STATUSES = [["all", "All"], ["live", "Live"], ["finished", "Finished"], ["upcoming", "Upcoming"]];
const statusOf = m => inPlay(m) ? "live" : isFinal(m) ? "finished" : "upcoming";
function renderStatus() {
    const day = MATCHES.filter(m => inSport(m) && dayOf(m) === DAY);
    const n = k => k === "all" ? day.length : day.filter(m => statusOf(m) === k).length;
    const box = document.getElementById("status-strip");
    box.innerHTML = STATUSES.map(([k, label]) => `<button type="button" data-status="${k}" aria-pressed="${k === STATUS}"
        class="shrink-0 inline-flex items-center gap-xs min-h-[36px] px-md py-xs rounded-full border text-label-sm font-bold ${k === STATUS
            ? "bg-primary text-on-primary border-primary"
            : "border-outline-variant text-on-surface-variant hover:bg-surface-container-high"}">
        ${k === "live" ? '<span class="pp-live-dot"></span>' : ""}${label} <span class="tabular-nums font-medium opacity-80">${n(k)}</span></button>`).join("");
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        STATUS = b.dataset.status; renderStatus(); renderList();
    }));
}

function renderDays() {
    // From yesterday on: a late kickoff dated yesterday in UTC can fall on the
    // day before in the viewer's time, which would add a stray older day.
    const y = new Date(Date.now() - 864e5);
    const yesterday = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, "0")}-${String(y.getDate()).padStart(2, "0")}`;
    const days = [...new Set(MATCHES.filter(inSport).map(dayOf))].filter(k => k >= yesterday).sort();
    const strip = document.getElementById("day-strip");
    strip.innerHTML = days.map(k => `<button type="button" data-day="${k}" aria-pressed="${k === DAY}"
        class="shrink-0 min-h-[36px] px-md py-xs rounded-full border text-label-sm font-bold ${k === DAY
            ? "bg-primary text-on-primary border-primary"
            : "border-outline-variant text-on-surface-variant hover:bg-surface-container-high"}">${dayName(k)}</button>`).join("");
    strip.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        DAY = b.dataset.day; renderDays(); renderStatus(); renderList();
    }));
}

function row(m) {
    const sc = score(m);
    const live = inPlay(m);
    const left = live ? `<span class="text-error font-bold tabular-nums">${esc(m.live_detail || "Live")}</span>`
        : isFinal(m) ? `<span class="text-on-surface-variant font-semibold">FT</span>`
        : `<span class="text-on-surface-variant tabular-nums">${esc(kickoffLabel(m.match_date, m.kickoff_time, m.kickoff_utc).replace(/^(Today|Tomorrow|Yesterday) /, ""))}</span>`;
    const pick = m.confidence === "HIGH" || m.confidence === "MEDIUM"
        ? `<div class="text-label-sm text-secondary font-semibold mt-[2px]">Our pick: ${esc(pickName(m))} · ${Math.round((m.best_bet_prob || 0) * 100)}%${verdict(m)}</div>` : "";
    const team = (name, goals, won) => `<div class="flex items-center justify-between gap-sm">
        <span class="truncate ${won ? "font-bold text-primary" : "text-on-surface"}">${esc(name)}</span>
        ${sc ? `<span class="tabular-nums font-bold ${live ? "text-error" : "text-primary"}">${esc(String(goals))}</span>` : ""}</div>`;
    const hw = sc && isFinal(m) && +sc[0] > +sc[1], aw = sc && isFinal(m) && +sc[1] > +sc[0];
    // The match page is football's; other sports open their pick (analysis + markets) on Picks.
    const href = m.sport === "football" ? `match.html?id=${encodeURIComponent(m.match_id)}` : `picks.html?sport=${m.sport}`;
    return `<a href="${href}"
        class="flex items-center gap-md px-md py-sm hover:bg-surface-container-high focus-visible:bg-surface-container-high">
        <div class="w-14 shrink-0 text-label-sm text-center">${live ? '<span class="pp-live-dot"></span> ' : ""}${left}</div>
        <div class="flex-1 min-w-0 text-body-md">${team(m.home_team, sc && sc[0], hw)}${team(m.away_team, sc && sc[1], aw)}${pick}</div>
      </a>`;
}

function renderList() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const shown = MATCHES.filter(m => inSport(m) && dayOf(m) === DAY &&
        (STATUS === "all" || statusOf(m) === STATUS) &&
        (!q || `${m.home_team} ${m.away_team} ${m.league_display}`.toLowerCase().includes(q)));
    const list = document.getElementById("list");
    if (!shown.length) {
        list.innerHTML = `<p class="text-body-md text-on-surface-variant py-lg text-center">${{live: "Nothing is being played right now.", finished: "No finished matches yet that day.", upcoming: "Nothing left to start that day."}[STATUS] || "No matches found for that day."}</p>`;
        return;
    }
    // Leagues in kickoff order, favourites first; live games float to the top of their league.
    const groups = new Map();
    shown.forEach(m => { if (!groups.has(m.league)) groups.set(m.league, []); groups.get(m.league).push(m); });
    const order = [...groups.keys()].sort((a, b) => FAVS.has(b) - FAVS.has(a));
    list.innerHTML = order.map(lg => {
        const ms = groups.get(lg).slice().sort((a, b) => inPlay(b) - inPlay(a));
        const fav = FAVS.has(lg);
        return `<section class="mb-md rounded-xl border border-outline-variant bg-surface-container-lowest overflow-hidden">
          <div class="flex items-center justify-between pl-md pr-xs py-xs bg-surface-container-low border-b border-outline-variant">
            <h2 class="min-w-0 flex items-baseline gap-xs text-label-sm font-bold text-on-surface-variant uppercase tracking-wider">
              <span class="truncate">${esc(ms[0].league_display || prettyLeague(lg))}</span>
              <span class="shrink-0 font-medium tabular-nums normal-case tracking-normal">${ms.length}</span></h2>
            <button type="button" class="fav w-9 h-9 inline-flex items-center justify-center rounded-full hover:bg-surface-container-high ${fav ? "text-secondary" : "text-on-surface-variant"}"
                    data-league="${esc(lg)}" aria-pressed="${fav}" aria-label="${fav ? "Remove from" : "Add to"} favourite leagues">
              <span class="material-symbols-outlined text-[20px] ${fav ? "icon-fill" : ""}" aria-hidden="true">star</span></button>
          </div>
          <div class="divide-y divide-outline-variant">${ms.map(row).join("")}</div></section>`;
    }).join("");
    list.querySelectorAll(".fav").forEach(b => b.addEventListener("click", () => {
        const lg = b.dataset.league;
        if (FAVS.has(lg)) FAVS.delete(lg); else FAVS.add(lg);
        saveFavs();
        renderList();
    }));
}

// Open on today if the chosen sport has anything today, else its next day with matches.
function pickDay() {
    const today = dayOf({match_date: "", kickoff_utc: new Date().toISOString().slice(0, 16).replace("T", " ")});
    const days = [...new Set(MATCHES.filter(inSport).map(dayOf))].sort();
    if (days.includes(DAY)) return;
    DAY = days.includes(today) ? today : (days.find(d => d > today) || days[days.length - 1] || today);
}

async function load(refresh = false) {
    const list = document.getElementById("list");
    if (!refresh) list.innerHTML = `<div class="space-y-sm">${ppSkeleton(140)}${ppSkeleton(140)}</div>`;
    try {
        MATCHES = (await PotentialProAPI.matches(true)).matches || [];
        if (!refresh) {
            // A remembered sport with nothing on (NFL off-week) falls back to all sports.
            if (!MATCHES.some(inSport)) SPORT = "all";
            pickDay();
        }
        renderSports();
        renderDays();
        renderStatus();
        renderList();
    } catch (err) {
        if (!refresh) list.innerHTML = ppErrorBox(err, "load the matches", "load");
        console.error(err);
    }
}

// Scores refresh once a minute while something is live and the tab is visible.
setInterval(() => {
    if (document.visibilityState === "visible" && MATCHES.some(inPlay)) load(true);
}, 60000);

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("search").addEventListener("input", renderList);
    syncFavs();
    load();
});
</script>
