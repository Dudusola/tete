<script>
const pct = v => v == null ? "—" : `${Math.round(v * 100)}%`;
const card = (title, inner) => `<section class="mt-lg"><h2 class="text-body-lg font-semibold text-primary mb-sm">${title}</h2>${inner}</section>`;
const TIER_CLASS = {HIGH: "bg-secondary-container text-on-secondary-container",
                    MEDIUM: "bg-surface-container-high text-primary", LOW: "bg-surface-container-high text-on-surface-variant"};

function scoreLine(d) {
    const final = d.result_home_goals != null;
    if (!final && !hasKickedOff(d)) return "";   // no "0-0 Scheduled" before kickoff
    const score = final ? `${d.result_home_goals}–${d.result_away_goals}` : (d.live_score || "").replace("-", "–");
    if (!score) return "";
    const live = !final && !d.live_final;
    return `<p class="mt-sm text-headline-md font-headline-md tabular-nums ${live ? "text-error" : "text-primary"}">${esc(score)}
      <span class="text-label-sm font-semibold align-middle">${live ? `<span class="pp-live-dot"></span> ${esc(d.live_detail || "live")}` : "full time"}</span></p>`;
}

function pickBlock(d) {
    const res = {H: "Home Win", D: "Draw", A: "Away Win"}[d.result_outcome];
    const verdict = res ? (res === d.best_bet ? `<b class="text-secondary">Our pick won.</b>` : `<b class="text-error">Our pick lost.</b>`) : "";
    const pickName = d.best_bet === "Home Win" ? `${d.home_team} Win` : d.best_bet === "Away Win" ? `${d.away_team} Win` : d.best_bet;
    const bar = (label, v) => `<div class="flex-1 min-w-0"><div class="h-2 rounded-full bg-surface-container-high overflow-hidden">
        <div class="h-full bg-secondary" style="width:${Math.round((v || 0) * 100)}%"></div></div>
        <div class="text-label-sm text-on-surface-variant mt-xs truncate">${esc(label)} <b class="text-primary tabular-nums">${pct(v)}</b></div></div>`;
    const low = d.confidence === "LOW"
        ? `<p class="text-label-sm text-on-surface-variant mt-sm">Low confidence, so this is not one of our recommended picks.</p>` : "";
    return card("Our pick", `
      <div class="flex items-start justify-between gap-md">
        <div><div class="text-headline-md font-headline-md text-primary">${esc(ppPlainPick(pickName))}</div>
          <div class="text-body-md text-on-surface-variant">We give it a <b class="text-primary tabular-nums">${pct(d.best_bet_prob)}</b> chance. ${verdict}</div></div>
        <span class="shrink-0 ${TIER_CLASS[d.confidence] || TIER_CLASS.LOW} px-sm py-base rounded-full text-label-sm font-bold">${esc(d.confidence)}</span>
      </div>
      <div class="flex gap-sm mt-md">${bar(d.home_team, d.home_win_prob)}${bar("Draw", d.draw_prob)}${bar(d.away_team, d.away_win_prob)}</div>${low}`);
}

function priceBlock(d) {
    const hist = d.price_history || [];
    const now = hist[hist.length - 1];
    const side = {"Home Win": "odds_home", "Draw": "odds_draw", "Away Win": "odds_away"}[d.best_bet];
    const rows = [];
    if (d.book_odds) rows.push(["When we made the pick", d.book_odds]);
    if (d.close_odds) rows.push(["Just before kickoff", d.close_odds]);
    if (now && side && now[side]) rows.push(["SportyBet, latest", now[side]]);
    if (!rows.length) return card("The price", `<p class="text-body-md text-on-surface-variant">We have no bookmaker price stored for this match.</p>`);
    const book = d.book_prob ?? d.close_prob;
    const gap = book == null ? null : (d.best_bet_prob || 0) - book;
    const compare = gap == null ? "" : `<p class="text-body-md text-on-surface-variant mt-sm">We give our pick ${pct(d.best_bet_prob)}; the bookmaker's price says about ${pct(book)}.
        ${Math.abs(gap) < 0.03 ? "We broadly agree with the bookmaker." : gap > 0 ? "We rate it a bit higher than the bookmaker does." : "The bookmaker rates it higher than we do."}</p>`;
    const warn = (d.warnings || []).map(w => `<p class="mt-sm text-body-md text-error flex gap-xs"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">warning</span>${esc(w.text || w)}</p>`).join("");
    const when = s => new Date(s.replace(" ", "T") + "Z").toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});
    const trail = hist.length > 1 ? `<details class="mt-sm text-label-sm text-on-surface-variant"><summary class="cursor-pointer text-secondary font-semibold">How SportyBet's price moved (${hist.length} changes)</summary>
        <table class="w-full mt-xs tabular-nums"><thead><tr><th class="text-left font-medium">Seen</th><th class="text-right font-medium">Home</th><th class="text-right font-medium">Draw</th><th class="text-right font-medium">Away</th></tr></thead>
        <tbody>${hist.slice().reverse().map(h => `<tr><td>${esc(when(h.observed_at))}</td>
          <td class="text-right">${h.odds_home ?? "—"}</td><td class="text-right">${h.odds_draw ?? "—"}</td><td class="text-right">${h.odds_away ?? "—"}</td></tr>`).join("")}</tbody></table></details>` : "";
    return card("The price", `<dl class="divide-y divide-outline-variant text-body-md">${rows.map(([k, o]) => `<div class="flex justify-between py-xs"><dt class="text-on-surface-variant">${k}</dt><dd class="font-semibold text-primary tabular-nums">${Number(o).toFixed(2)}</dd></div>`).join("")}</dl>${compare}${warn}${trail}`);
}

function formBlock(d) {
    const f = d.facts;
    if (!f) return card("Form", `<p class="text-body-md text-on-surface-variant">Form details are saved with picks made from 22 Oct 2026 onwards; this pick is older.</p>`);
    const letters = s => (s || "").split("").map(c => `<span class="w-6 h-6 inline-flex items-center justify-center rounded text-label-sm font-bold ${c === "W" ? "bg-secondary-container text-on-secondary-container" : c === "L" ? "bg-error-container text-on-error-container" : "bg-surface-container-high text-on-surface-variant"}">${c}</span>`).join("");
    const n = v => v == null ? "—" : Number(v).toFixed(1);
    const team = (name, side, venueKey, venueWord) => {
        const games = f[`${side}_games`] || 0;
        const recent = f[`${side}_recent`];
        return `<div class="rounded-lg border border-outline-variant p-md">
          <div class="font-semibold text-primary">${esc(name)}</div>
          <div class="flex gap-xs mt-xs" role="img" aria-label="Last results, oldest first: ${esc(recent || "none")}">${letters(recent) || `<span class="text-label-sm text-on-surface-variant">No recent games in our records</span>`}</div>
          <ul class="mt-sm text-body-md text-on-surface-variant space-y-[2px]">
            <li><b class="text-primary tabular-nums">${n(f[`${side}_form_ppg`])}</b> points a game</li>
            <li>Scores <b class="text-primary tabular-nums">${n(f[`${side}_goals_for_avg`])}</b>, lets in <b class="text-primary tabular-nums">${n(f[`${side}_goals_against_avg`])}</b> a game</li>
            <li>${venueWord}: <b class="text-primary tabular-nums">${n(f[venueKey])}</b> points a game</li>
          </ul>
          ${goalsRecord(f[`${side}_goals_record`])}
          ${games < (f.form_window || 5) ? `<p class="text-label-sm text-on-surface-variant mt-xs">Based on only ${games} game${games === 1 ? "" : "s"}, so treat it with care.</p>` : ""}
        </div>`;
    };
    const [w, dr, l] = f.h2h_record || [0, 0, 0];
    const met = w + dr + l;
    const h2h = met ? `${esc(d.home_team)} won ${w}, drew ${dr} and lost ${l} of the last ${met} meeting${met === 1 ? "" : "s"}.`
                    : "These two have not met in our records.";
    return card("Form", `<p class="text-label-sm text-on-surface-variant mb-sm">As it stood when we made the pick. W = win, D = draw, L = loss, oldest first.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">${team(d.home_team, "home", "home_home_ppg", "At home")}${team(d.away_team, "away", "away_away_ppg", "Away from home")}</div>
      <p class="text-body-md text-on-surface-variant mt-sm">${h2h}</p>`);
}

function scoresBlock(d, cs) {
    const ls = d.likely_scores || [];
    if (!ls.length) return "";
    cs = cs || {};
    return card("Most likely scores", `<div class="flex flex-wrap gap-xs">${ls.map(x => {
        const odds = cs[`${x.home}:${x.away}`];
        return `<span class="inline-flex items-center gap-xs px-sm py-xs rounded-lg border border-outline-variant text-body-md">
           <b class="text-primary tabular-nums">${x.home}–${x.away}</b><span class="text-on-surface-variant tabular-nums">${pct(x.probability)}</span>
           ${odds ? `<span class="text-label-sm text-on-surface-variant tabular-nums">· SportyBet ${odds.toFixed(2)}</span>` : ""}</span>`; }).join("")}</div>
      <p class="text-label-sm text-on-surface-variant mt-xs">From how often each team scores and concedes (about ${d.expected_goals[0].toFixed(1)} and ${d.expected_goals[1].toFixed(1)} goals). Any one exact score is unlikely; these are just the most likely few.</p>`);
}

function goalsRecord(g) {
    if (!g || !g.games) return "";
    return `<p class="text-label-sm text-on-surface-variant mt-sm">Last ${g.games} games: 3+ goals in <b class="text-primary">${g.over_2_5}</b>,
      both teams scored in <b class="text-primary">${g.btts}</b>, kept a clean sheet in <b class="text-primary">${g.clean_sheets}</b>,
      failed to score in <b class="text-primary">${g.failed_to_score}</b>.</p>`;
}

/* ── Match centre (GET /api/match/<id>/centre: ESPN + SportyBet, free) ── */
function eventsBlock(c, d) {
    if (!c || !c.events || !c.events.length) return "";
    const icon = k => k === "goal" || k === "own goal"
        ? `<span class="material-symbols-outlined text-[18px] text-secondary" aria-hidden="true">sports_soccer</span>`
        : `<span class="inline-block w-3 h-4 rounded-sm ${k === "red" ? "bg-error" : k === "yellow" ? "bg-[#f5c518]" : "bg-surface-container-high"}" aria-hidden="true"></span>`;
    const word = {"goal": "Goal", "own goal": "Own goal", "yellow": "Yellow card", "red": "Red card", "penalty missed": "Penalty missed"};
    return card("Match events", `<ul class="divide-y divide-outline-variant text-body-md">${c.events.map(e => `
      <li class="flex items-center gap-sm py-xs ${e.team === d.away_team ? "flex-row-reverse text-right" : ""}">
        <span class="w-10 shrink-0 tabular-nums text-on-surface-variant ${e.team === d.away_team ? "text-right" : ""}">${esc(e.minute || "")}</span>${icon(e.kind)}
        <span class="min-w-0"><b class="text-primary">${esc(e.player || "")}</b> <span class="text-label-sm text-on-surface-variant">${word[e.kind] || ""}, ${esc(e.team || "")}</span></span></li>`).join("")}</ul>`);
}
function statsBlock(c, d) {
    if (!c || !c.stats || !c.stats.length) return "";
    const row = s => {
        const h = parseFloat(s.home) || 0, a = parseFloat(s.away) || 0, share = h + a ? Math.round(h / (h + a) * 100) : 50;
        return `<div class="py-xs"><div class="flex justify-between text-body-md"><b class="text-primary tabular-nums">${esc(s.home)}</b>
          <span class="text-label-sm text-on-surface-variant">${esc(s.label)}</span><b class="text-primary tabular-nums">${esc(s.away)}</b></div>
          <div class="flex h-1.5 rounded-full overflow-hidden bg-surface-container-high mt-[2px]">${h + a ? `<div class="bg-secondary" style="width:${share}%"></div>` : ""}</div></div>`;
    };
    return card("Match stats", `<div class="flex justify-between text-label-sm text-on-surface-variant mb-xs"><span>${esc(d.home_team)}</span><span>${esc(d.away_team)}</span></div>${c.stats.map(row).join("")}`);
}
function lineupsBlock(c) {
    if (!c || !c.lineups || !c.lineups.length) return "";
    return card("Line-ups", `<details><summary class="cursor-pointer text-body-md text-secondary font-semibold">Show the starting line-ups</summary>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-sm mt-sm">${c.lineups.map(l => `<div class="rounded-lg border border-outline-variant p-sm">
        <div class="font-semibold text-primary">${esc(l.team)} <span class="text-label-sm text-on-surface-variant font-normal">${esc(l.formation || "")}</span></div>
        <ul class="mt-xs text-body-md text-on-surface-variant">${l.starters.map(p => `<li>${esc(p.name || "")} <span class="text-label-sm">${esc(p.position || "")}</span></li>`).join("")}</ul></div>`).join("")}</div></details>`);
}
function recentBlock(c, d) {
    if (!c) return "";
    const last5 = (c.last5 || []).filter(t => t.games && t.games.length);
    const rows = (c.table || []).filter(r => r.team === d.home_team || r.team === d.away_team);
    if (!last5.length && !rows.length) return "";
    const tile = g => `<span title="${esc(`${g.at === "@" ? "at" : "vs"} ${g.opponent || ""} ${g.score || ""} (${g.competition || ""})`)}"
        class="w-6 h-6 inline-flex items-center justify-center rounded text-label-sm font-bold ${g.result === "W" ? "bg-secondary-container text-on-secondary-container" : g.result === "L" ? "bg-error-container text-on-error-container" : "bg-surface-container-high text-on-surface-variant"}">${esc(g.result || "?")}</span>`;
    const ord = n => { const v = +n; const s = ["th", "st", "nd", "rd"], m = v % 100; return v + (s[(m - 20) % 10] || s[m] || s[0]); };
    return card("Latest results and table", `
      ${last5.map(t => `<div class="flex items-center justify-between gap-sm py-xs"><span class="text-body-md text-primary truncate">${esc(t.team)}</span>
        <span class="flex gap-xs shrink-0" role="img" aria-label="Last five, newest first: ${esc(t.games.map(g => g.result).join(""))}">${t.games.map(tile).join("")}</span></div>`).join("")}
      ${rows.length ? `<p class="text-body-md text-on-surface-variant mt-sm">${rows.map(r => `${esc(r.team)}: <b class="text-primary">${ord(r.rank)}</b>, ${esc(r.points)} pts from ${esc(r.played)} games`).join(" · ")}.</p>` : ""}
      <p class="text-label-sm text-on-surface-variant mt-xs">From ESPN, all competitions. Tap a box for the opponent and score.</p>`);
}
function commentaryBlock(c) {
    if (!c || !c.commentary || !c.commentary.length) return "";
    return card("Commentary", `<details><summary class="cursor-pointer text-body-md text-secondary font-semibold">Latest ${c.commentary.length} updates</summary>
      <ul class="mt-sm space-y-xs text-body-md text-on-surface-variant">${c.commentary.map(x => `<li><b class="text-primary tabular-nums">${esc(x.minute || "")}</b> ${esc(x.text)}</li>`).join("")}</ul></details>`);
}

async function loadCentre(id, d) {
    try {
        const c = await PotentialProAPI.matchCentre(id);
        const e = c.espn;
        if (e && e.venue) document.getElementById("venue").textContent = ` · ${e.venue}`;
        document.getElementById("centre-top").innerHTML = eventsBlock(e, d) + statsBlock(e, d);
        document.getElementById("centre-mid").innerHTML = recentBlock(e, d) + lineupsBlock(e);
        document.getElementById("centre-end").innerHTML = commentaryBlock(e);
        if (c.correct_scores && Object.keys(c.correct_scores).length)
            document.getElementById("scores").innerHTML = scoresBlock(d, c.correct_scores);
    } catch (err) {
        console.error("match centre:", err);    // extra detail only; the page stands without it
    }
}

function marketsBlock(d) {
    const ms = d.markets || [];
    if (!ms.length) return "";
    const row = m => `<li class="flex justify-between gap-md py-xs" title="Bookmaker calls it: ${esc(m.market)} · ${esc(m.selection)}">
        <span>${esc(ppPlainPick(m.selection))}</span><span class="tabular-nums font-semibold text-primary">${pct(m.probability)}</span></li>`;
    return card("Other ways to bet it", `<p class="text-label-sm text-on-surface-variant mb-xs">Our chance for each. Only "who wins" has a graded record so far.</p>
      <ul class="divide-y divide-outline-variant text-body-md">${ms.slice(0, 8).map(row).join("")}</ul>
      ${ms.length > 8 ? `<details class="text-body-md"><summary class="cursor-pointer text-secondary font-semibold py-xs">Show ${ms.length - 8} more</summary>
        <ul class="divide-y divide-outline-variant">${ms.slice(8).map(row).join("")}</ul></details>` : ""}`);
}

async function load() {
    const id = new URLSearchParams(location.search).get("id");
    const box = document.getElementById("match");
    if (!id) { box.innerHTML = `<p class="text-body-md">No match chosen. <a class="text-secondary underline" href="index.html">Back to Matches</a></p>`; return; }
    box.innerHTML = `<div class="space-y-md">${ppSkeleton(80)}${ppSkeleton(140)}${ppSkeleton(140)}</div>`;
    try {
        const d = await PotentialProAPI.match(id);
        document.title = `${d.home_team} vs ${d.away_team} - PotentialPro`;
        setTimeout(() => loadCentre(id, d));
        box.innerHTML = `
          <header>
            <div class="text-label-sm text-on-surface-variant">${esc(d.league_display || prettyLeague(d.league))} · ${esc(kickoffLabel(d.match_date, d.kickoff_time, d.kickoff_utc))}<span id="venue"></span></div>
            <h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-primary mt-xs">${esc(d.home_team)} vs ${esc(d.away_team)}</h1>
            ${scoreLine(d)}
          </header>
          <div id="centre-top"></div>
          ${pickBlock(d)}${priceBlock(d)}${formBlock(d)}<div id="centre-mid"></div><div id="scores">${scoresBlock(d)}</div>
          ${d.gemma_analysis ? card("Why we picked it", `<p class="text-body-md text-on-surface-variant leading-relaxed max-w-prose">${esc(d.gemma_analysis)}</p>`) : ""}
          ${marketsBlock(d)}<div id="centre-end"></div>
          <p class="mt-xl text-label-sm text-on-surface-variant">Predictions are not guarantees. 18+ only; never stake what you can't afford to lose.</p>`;
    } catch (err) {
        box.innerHTML = ppErrorBox(err, "load this match", "load");
        console.error(err);
    }
}
document.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
