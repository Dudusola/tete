# Cloudflare Worker config — COMMITTED, so it must never contain secrets.
# Secrets go in with: wrangler secret put BOT_TOKEN / GITHUB_TOKEN / WEBHOOK_SECRET
# (web push: VAPID_PRIVATE_KEY + SUPABASE_SERVICE_KEY, via deploy-worker.yml)

name = "potentialpro-bot"
main = "index.js"
compatibility_date = "2026-08-01"

# Plain config only. REPO and FEED_PATH are not sensitive — the repo is private
# and reading it still requires GITHUB_TOKEN.
# Keep console.log output (push counts, dispatch results) for 3 days. Free plan:
# 200k events/day; we log a few hundred. Without it, the only window was a live
# `wrangler tail`, which kept dropping, so push delivery could not be checked.
[observability]
enabled = true

[vars]
REPO = "Dudusola/tete"
FEED_PATH = "feed/bot_feed.json"
# The bot calls the real API for /slip rather than rebuilding build_slip in JS.
API_BASE = "https://potentialpro-api.onrender.com"
# Web push (push.js). The PUBLIC half of the VAPID key - the browser needs it
# too (webapp/js/auth.js). The private half is the VAPID_PRIVATE_KEY secret.
VAPID_PUBLIC_KEY = "BF66BNM2qZtaEP5NjU53DrKo4bhuevSs2h6XIoT8HWzGbMSGr4eDSvPciibRc3unS8ZhMnKFxmoV88RQi-FjFoY"
SUPABASE_URL = "https://vtltrjsjhfdhlrqrswvt.supabase.co"

# Starts the daily pipeline ON TIME. 06:00 UTC = 07:00 Lagos: picks and the
# Telegram push land before the first European kickoff (11:30 UTC) instead of
# mid-afternoon. See triggerDailyPipeline in index.js for why GitHub's own
# schedule could not do this.
#
# "*/10 * * * *" keeps the API awake. Render's free instance sleeps after ~15
# idle minutes and the next visitor then waits ~50s on skeleton loaders - for
# a first-time tester that reads as a broken site. A ping every 10 minutes
# costs 144 tiny requests a day; one always-on service is ~744h/month, inside
# Render's 750 free hours as long as it is the ONLY free service.
[triggers]
# "20 * * * *" starts closing.yml ON TIME - GitHub's hourly schedule for it
# ran every 3-6 hours in practice (see the handler in index.js). It shares
# the ledger's concurrency group, and GitHub cancels a PENDING run when a
# newer one queues; closing takes ~1-3 min and the 06:00 daily is normally
# done by 06:20, and daily.yml's 08:50 backup covers the rare collision.
crons = ["0 6 * * *", "*/10 * * * *", "20 * * * *"]
